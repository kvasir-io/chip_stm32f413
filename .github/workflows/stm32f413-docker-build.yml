name: Build and Push STM32F413 Container

# kvasirio/stm32f413: Kvasir_SDK's chip-image.yml builds it from Kvasir_SDK scripts/Dockerfile.chip with this repository
# as the context and sets the "STM32F413 Container Build" commit status. The file name is what Kvasir_SDK's
# dispatch-chip-images.yml dispatches after a new kvasirio/kvasir image or a kvasir_devices push.

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    image:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/chip-image.yml@master
        with: {chip: stm32f413, title: STM32F413, with-kvasir-devices: false}
        secrets: inherit
