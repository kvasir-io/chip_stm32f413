name: Tests

# test: the host tests of this chip's clock arithmetic (tests/CMakeLists.txt): most checks are static_asserts, so
# building is the test. tests/CMakeLists.txt fetches Kvasir_SDK's headers itself when there is no checkout next to this
# one. The core SVD check (core_prio4.svd up to date) is core_cortex_m4's own CI.
# conformance: the chip's conformance tree (tests/conformance), Kvasir_SDK package-conformance.yml.

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    test:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-host-tests.yml@master
        with: {extra-packages: python, submodules: 'true'}

    conformance:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-conformance.yml@master

    # the include layering of this repository against Kvasir_SDK tools/layers.toml (any finding fails)
    layers:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-layers.yml@master
